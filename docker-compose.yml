services:
  mysql:
    image: mysql:8.0
    container_name: f1_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: f1password
      MYSQL_DATABASE: f1_kaggle
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongodb:
    image: mongo:7.0
    container_name: f1_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: f1password
      MONGO_INITDB_DATABASE: f1_tracinginsights
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
